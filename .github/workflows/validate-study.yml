name: Validar formação

on:
  push:
    branches:
      - claude/formacao-profissional-empreendedora-np6j6r
  pull_request:

permissions:
  contents: read

jobs:
  validate-study:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obter repositório
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Testar o validador curricular
        run: python3 -m unittest discover -s tests -v
      - name: Validar trilhas e checklist
        run: python3 scripts/validate_curriculum.py
      - name: Validar o estado do tutor
        working-directory: .claude/skills/ai-tutor
        run: python3 -m scripts.validate_study ../../..
